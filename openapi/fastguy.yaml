openapi: 3.1.0
info:
  title: FastGuy API
  version: 1.0.0
  description: Contract-first coverage for FastGuy endpoints as they change.
  license:
    name: Proprietary
servers:
  - url: /api
paths:
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      summary: Get operational and financial overview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reports/full:
    get:
      operationId: getAdminFullReport
      summary: Get operational cohort and financial event report
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 6m, 1y]
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Reconciled report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFullReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /categories:
    get:
      operationId: listCategories
      summary: List active menu categories
      security: []
      responses:
        '200':
          description: Active categories ordered by configured sort order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
  /homepage:
    get:
      operationId: getHomepage
      summary: Get curated homepage content
      security: []
      responses:
        '200':
          description: Homepage products, occasion combos, and public featured reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomepageResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/profile:
    get:
      operationId: getProfile
      summary: Get the authenticated profile for any role
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateProfile
      summary: Update the authenticated profile including avatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List users for administration
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAdminUser
      summary: Create a user including an optional avatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/users/{userId}:
    get:
      operationId: getAdminUser
      summary: Get a user for administration
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateAdminUser
      summary: Update a user including replacing or removing the avatar
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteAdminUser
      summary: Delete an unused user account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /reviews/order/{orderId}:
    get:
      operationId: getReviewByOrder
      summary: Get the authenticated customer's review state for an order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Customer review state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewByOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /reviews:
    post:
      operationId: createReview
      summary: Submit an order review with optional explicit homepage consent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '200':
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Order was already reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/categories:
    get:
      operationId: listAdminCategories
      summary: List categories for administration
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAdminCategory
      summary: Create a menu category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/categories/{categoryId}:
    put:
      operationId: updateAdminCategory
      summary: Update a menu category
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteAdminCategory
      summary: Delete an unused menu category
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/products:
    get:
      operationId: listAdminProducts
      summary: List admin product details
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAdminProduct
      summary: Create an admin product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductCreateRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/products/{productId}:
    get:
      operationId: getAdminProduct
      summary: Get an admin product detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Admin product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:

      operationId: updateAdminProduct
      summary: Update homepage product metadata
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductUpdateRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/products/{productId}/combo:
    get:
      operationId: getAdminProductCombo
      summary: Get an admin product combo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Admin combo detail or null when no combo exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminComboDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:

      operationId: createAdminProductCombo
      summary: Create combo with homepage metadata
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminComboUpdateRequest'
      responses:
        '200':
          description: Combo created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateAdminProductCombo
      summary: Update combo homepage metadata
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminComboUpdateRequest'
      responses:
        '200':
          description: Combo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/products/{productId}/combo/items:
    post:
      operationId: createAdminProductComboItem
      summary: Add an item to an admin product combo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminComboItemCreateRequest'
      responses:
        '201':
          description: Combo item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminComboMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/products/{productId}/combo/items/{itemId}:
    delete:
      operationId: deleteAdminProductComboItem
      summary: Delete an item from an admin product combo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Combo item deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/orders/{orderId}:
    get:
      operationId: getAdminOrderDetail
      summary: Get private admin order detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Private admin order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/orders/{orderId}/featured-review:
    put:
      operationId: updateFeaturedReview
      summary: Toggle the order review's homepage visibility
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeaturedReviewUpdateRequest'
      responses:
        '200':
          description: Featured review state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFeaturedReviewMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Review is not eligible for homepage publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Administrator access required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:

      description: Homepage data could not be loaded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AdminDashboardData:
      type: object
      additionalProperties: true
      required: [customerCount, activeProductCount, ordersByStatus, operationalOrderCount, operationalCompletedCount, completionRate, totalRevenue, revenueToday, ordersToday, pendingCodAmount, pendingCodCount, lowStockThreshold, outOfStockSkuCount, lowStockSkuCount]
      properties:
        customerCount: { type: integer, minimum: 0 }
        activeProductCount: { type: integer, minimum: 0 }
        ordersByStatus:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        operationalOrderCount: { type: integer, minimum: 0 }
        operationalCompletedCount: { type: integer, minimum: 0 }
        completionRate: { type: number, minimum: 0, maximum: 100 }
        totalRevenue: { type: number, minimum: 0 }
        revenueToday: { type: number, minimum: 0 }
        ordersToday: { type: integer, minimum: 0 }
        pendingCodAmount: { type: number, minimum: 0 }
        pendingCodCount: { type: integer, minimum: 0 }
        lowStockThreshold: { type: integer, minimum: 1 }
        outOfStockSkuCount: { type: integer, minimum: 0 }
        lowStockSkuCount: { type: integer, minimum: 0 }
    AdminDashboardResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/AdminDashboardData' }
    AdminFullReportData:
      type: object
      additionalProperties: true
      required: [itemRevenue, shippingRevenue, serviceFeeRevenue, discountTotal, grossRevenue, refundTotal, netCashRevenue, operationalOrderCount, operationalCompletedCount, completionRate, revenueByHour, performanceByWeekday, refundTrend, exceptionReasons, monthlyFinancialTrend]
      properties:
        itemRevenue: { type: number, minimum: 0 }
        shippingRevenue: { type: number, minimum: 0 }
        serviceFeeRevenue: { type: number, minimum: 0 }
        discountTotal: { type: number, minimum: 0 }
        grossRevenue: { type: number, minimum: 0 }
        refundTotal: { type: number, minimum: 0 }
        netCashRevenue: { type: number }
        operationalOrderCount: { type: integer, minimum: 0 }
        operationalCompletedCount: { type: integer, minimum: 0 }
        completionRate: { type: number, minimum: 0, maximum: 100 }
        monthlyFinancialTrend:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [year, month, grossRevenue, refundTotal, netCashRevenue]
            properties:
              year: { type: integer, minimum: 2000 }
              month: { type: integer, minimum: 1, maximum: 12 }
              grossRevenue: { type: number, minimum: 0 }
              refundTotal: { type: number, minimum: 0 }
              netCashRevenue: { type: number }
        revenueByHour:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [hour, orders, revenue]
            properties:
              hour: { type: integer, minimum: 0, maximum: 23 }
              orders: { type: integer, minimum: 0 }
              revenue: { type: number, minimum: 0 }
        performanceByWeekday:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [weekday, orders, completed, completionRate]
            properties:
              weekday: { type: integer, minimum: 1, maximum: 7 }
              orders: { type: integer, minimum: 0 }
              completed: { type: integer, minimum: 0 }
              completionRate: { type: number, minimum: 0, maximum: 100 }
        refundTrend:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [date, count, amount]
            properties:
              date: { type: string, format: date }
              count: { type: integer, minimum: 0 }
              amount: { type: number, minimum: 0 }
        exceptionReasons:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [reason, count]
            properties:
              reason: { type: string }
              count: { type: integer, minimum: 0 }
    AdminFullReportResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/AdminFullReportData' }
    UserProfile:
      type: object
      additionalProperties: false
      required: [userId, fullName, email, phone, avatarUrl, role, status, loyaltyPoints, createdAt]
      properties:
        userId:
          type: integer
          minimum: 1
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        avatarUrl:
          type: [string, 'null']
          format: uri
          pattern: '^https://'
          maxLength: 500
        role:
          type: string
          enum: [USER, STAFF, SHIPPER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        loyaltyPoints:
          type: integer
          minimum: 0
        createdAt:
          type: [string, 'null']
    UserProfileUpdateRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, phone, avatarUrl]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: [string, 'null']
          format: email
        phone:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
          pattern: '^https://'
          maxLength: 500
    UserProfileResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status:
          type: string
          const: success
        data:
          $ref: '#/components/schemas/UserProfile'
        message:
          type: string
    AdminUser:
      type: object
      additionalProperties: false
