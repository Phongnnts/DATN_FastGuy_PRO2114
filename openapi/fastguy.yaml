openapi: 3.1.0
info:
  title: FastGuy API
  version: 1.0.0
  description: Contract-first coverage for FastGuy endpoints as they change.
  license:
    name: Proprietary
servers:
  - url: /api
paths:
  /cart:
    get:
      operationId: getCart
      summary: Get the authenticated user's cart
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current cart, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponse' } } } }
    post:
      operationId: addCartItem
      summary: Add an item to the authenticated user's cart
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddCartItemRequest' } } } }
      responses:
        '201': { description: Item added }
        '400': { $ref: '#/components/responses/BadRequest' }
    put:
      operationId: updateCartItemQuantity
      summary: Update a cart item quantity
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCartItemRequest' } } } }
      responses:
        '200': { description: Item updated }
        '400': { $ref: '#/components/responses/BadRequest' }
  /cart/{cartItemId}:
    delete:
      operationId: removeCartItem
      summary: Remove a cart item
      security: [{ bearerAuth: [] }]
      parameters: [{ name: cartItemId, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        '200': { description: Item removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/guest-checkout:
    post:
      operationId: createGuestOrder
      summary: Create a guest order paid only through PayOS bank transfer
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestCheckoutRequest' }
      responses:
        '201':
          description: Guest order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestCheckoutResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/guest-payment-status:
    get:
      operationId: getGuestPaymentStatus
      summary: Verify a guest PayOS payment using its return proof
      security: []
      parameters:
        - { name: orderCode, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: token, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: Verified guest payment status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestPaymentStatusResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{orderId}/payment-status:
    get:
      operationId: getOrderPaymentStatus
      summary: Verify an authenticated PayOS payment
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          description: Verified payment status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      summary: Get operational and financial overview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/operating-expenses:
    get:
      operationId: listOperatingExpenses
      summary: List operating expenses
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Operating expenses, content: { application/json: { schema: { $ref: '#/components/schemas/OperatingExpenseListResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createOperatingExpense
      summary: Create an operating expense
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperatingExpenseRequest' } } } }
      responses:
        '201': { description: Operating expense created, content: { application/json: { schema: { $ref: '#/components/schemas/OperatingExpenseResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/operating-expenses/{expenseId}:
    parameters:
      - { name: expenseId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getOperatingExpense
      summary: Get an operating expense
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Operating expense, content: { application/json: { schema: { $ref: '#/components/schemas/OperatingExpenseResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateOperatingExpense
      summary: Update an operating expense
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperatingExpenseRequest' } } } }
      responses:
        '200': { description: Operating expense updated, content: { application/json: { schema: { $ref: '#/components/schemas/OperatingExpenseResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteOperatingExpense
      summary: Delete an operating expense
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Operating expense deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/fixed-assets:
    get:
      operationId: listFixedAssets
      summary: List fixed assets
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Fixed assets, content: { application/json: { schema: { $ref: '#/components/schemas/FixedAssetListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createFixedAsset
      summary: Create a fixed asset
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FixedAssetRequest' } } } }
      responses:
        '201': { description: Fixed asset created, content: { application/json: { schema: { $ref: '#/components/schemas/FixedAssetResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/fixed-assets/{assetId}:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getFixedAsset
      summary: Get a fixed asset
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Fixed asset, content: { application/json: { schema: { $ref: '#/components/schemas/FixedAssetResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateFixedAsset
      summary: Update an active fixed asset
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FixedAssetRequest' } } } }
      responses:
        '200': { description: Fixed asset updated, content: { application/json: { schema: { $ref: '#/components/schemas/FixedAssetResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/fixed-assets/{assetId}/retire:
    parameters:
      - { name: assetId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    put:
      operationId: retireFixedAsset
      summary: Retire an active fixed asset
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FixedAssetRetireRequest' } } } }
      responses:
        '200': { description: Fixed asset retired, content: { application/json: { schema: { $ref: '#/components/schemas/FixedAssetResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/reports/operating-profit:
    get:
      operationId: getOperatingProfitReport
      summary: Get operating profit for a date range
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: fromDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: toDate, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Operating profit report, content: { application/json: { schema: { $ref: '#/components/schemas/OperatingProfitResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /admin/reports/full:
    get:
      operationId: getAdminFullReport
      summary: Get operational cohort and financial event report
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 6m, 1y]
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Reconciled report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFullReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /staff/orders/shippers:
    get:
      operationId: listAvailableShippers
      summary: List active shippers currently checked into an active shift
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Available shippers with workload from their current shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableShipperListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /staff/orders/dispatch:
    get:
      operationId: listStaffDispatchOrders
      summary: List Staff dispatch orders by server classification
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum: [PRIORITY, NEW, REVIEW]
      responses:
        '200':
          description: Classified Staff dispatch orders and counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDispatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /staff/orders/{orderId}/assign-shipper:
    put:
      operationId: assignOrderShipper
      summary: Assign a ready order to a shipper in an active checked-in shift
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignShipperRequest'
      responses:
        '200':
          description: Shipper assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignShipperResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Selected shipper is no longer in an active checked-in shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /staff/orders/ownership-count:
    get:
      operationId: getStaffOwnershipCount
      summary: Count active orders owned by the authenticated Staff member's current shift
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current shift active ownership count for checkout precheck
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffOwnershipCountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/orders/handover:
    get:
      operationId: listStaffHandoverOrders
      summary: List active Staff-controlled orders requiring handover to the current shift
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Handover queue ordered by oldest relevant status time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffHandoverListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/orders/{orderId}/handover:
    put:
      operationId: claimStaffOrderHandover
      summary: Claim an active Staff-controlled order for the authenticated Staff member's current shift
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimStaffHandoverRequest' }
      responses:
        '200':
          description: Ownership claimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimStaffHandoverResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /shifts/{shiftId}/check-out:
    post:
      operationId: checkOutShift
      summary: Check out after every active Staff order ownership has been handed over
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shiftId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Shift checked out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Active Staff order ownership must be handed over first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftCheckoutConflictResponse' }
  /shifts/attendance:
    get:
      operationId: getMyShiftAttendance
      summary: Get authenticated Staff monthly attendance
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200': { description: Monthly attendance, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftAttendanceResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/shifts/attendance:
    get:
      operationId: getAdminShiftAttendance
      summary: Review monthly Staff attendance
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { name: userId, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/AttendanceStatus' } }
      responses:
        '200': { description: Monthly attendance review, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftAttendanceResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/staff/{userId}/pay-rates:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: listStaffPayRates
      summary: List append-only effective pay rates for one active Staff user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Pay rate history, content: { application/json: { schema: { $ref: '#/components/schemas/StaffPayRateListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createStaffPayRate
      summary: Append an effective pay rate without changing approved snapshots
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StaffPayRateRequest' } } }
      responses:
        '201': { description: Pay rate created, content: { application/json: { schema: { $ref: '#/components/schemas/StaffPayRateResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/shifts/{shiftId}/attendance-approval:
    put:
      operationId: approveShiftAttendance
      summary: Approve calculated attendance without changing check timestamps
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: shiftId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceApprovalRequest' } } }
      responses:
        '200': { description: Approved attendance, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftAttendanceMutationResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: No effective pay rate exists for the shift date
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /admin/shifts/week:
    get:
      operationId: getAdminShiftWeek
      summary: Get the Staff schedule for one Monday-based week
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: weekStart, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Weekly Staff schedule, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftWeekResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: replaceAdminShiftWeek
      summary: Replace the Staff schedule for one Monday-based week
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminShiftWeekUpdateRequest' }
      responses:
        '200': { description: Replaced weekly Staff schedule, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftWeekResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/shifts/monitoring:
    get:
      operationId: getAdminShiftMonitoring
      summary: Monitor current and adjacent Staff shift coverage
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Shift monitoring state, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftMonitoringResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /shifts/week:
    get:
      operationId: getShiftWeek
      summary: Get the authenticated Staff member's schedule for one Monday-based week
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: weekStart, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Weekly Staff schedule, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftWeekResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /store/config:
    get:
      operationId: getPublicStoreConfig
      summary: Get public store configuration
      security: []
      responses:
        '200': { description: Public store configuration, content: { application/json: { schema: { $ref: '#/components/schemas/PublicStoreConfigResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /categories:

    get:
      operationId: listCategories
      summary: List active menu categories
      security: []
      responses:
        '200':
          description: Active categories ordered by configured sort order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
  /products:
    get:
      operationId: listProducts
      summary: List public products with review summaries
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 1 }
        - name: categoryId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: minPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: availability
          in: query
          schema: { type: string, enum: [ALL, AVAILABLE, OUT_OF_STOCK, OUTSIDE_HOURS] }
        - name: productType
          in: query
          schema: { type: string, enum: [SIMPLE, VARIANT, CUSTOMIZABLE] }
        - name: discounted
          in: query
          schema: { type: boolean }
        - name: sold
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: sort
          in: query
          schema: { type: string, default: default, enum: [default, name, name-desc, newest, price-asc, price-desc, best-selling, discount-desc] }
        - name: page
          in: query
          description: Zero-based page index. page and size are both required when either is supplied.
          schema: { type: integer, minimum: 0 }
        - name: size
          in: query
          description: Page size. page and size are both required when either is supplied.
          schema: { type: integer, minimum: 1, maximum: 48 }
      responses:
        '200':
          description: Unpaged array when page and size are omitted; page envelope when both are supplied
          content:
            application/json:
              schema:
                oneOf:
