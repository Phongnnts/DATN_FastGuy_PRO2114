components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Administrator access required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:

      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ShiftCode:
      type: string
      enum: [MORNING, AFTERNOON, EVENING]
    NullableShiftCode:
      oneOf:
        - $ref: '#/components/schemas/ShiftCode'
        - type: 'null'
    ShiftMutationSource:
      type: string
      enum: [MANUAL, AUTO]
    NullableShiftMutationSource:
      oneOf:
        - $ref: '#/components/schemas/ShiftMutationSource'
        - type: 'null'
    StaffPayRateRequest:
      type: object
      additionalProperties: false
      required: [effectiveFrom, regularHourlyRate, overtimeHourlyRate]
      properties:
        effectiveFrom: { type: string, format: date }
        regularHourlyRate: { type: number, format: decimal, multipleOf: 0.01, exclusiveMinimum: 0 }
        overtimeHourlyRate: { type: number, format: decimal, multipleOf: 0.01, exclusiveMinimum: 0 }
    StaffPayRate:
      type: object
      additionalProperties: false
      required: [payRateId, userId, effectiveFrom, regularHourlyRate, overtimeHourlyRate, createdBy, createdAt]
      properties:
        payRateId: { type: integer, minimum: 1 }
        userId: { type: integer, minimum: 1 }
        effectiveFrom: { type: string, format: date }
        regularHourlyRate: { type: number, format: decimal, exclusiveMinimum: 0 }
        overtimeHourlyRate: { type: number, format: decimal, exclusiveMinimum: 0 }
        createdBy: { type: integer, minimum: 1 }
        createdAt: { type: string }
    StaffPayRateListResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { type: array, items: { $ref: '#/components/schemas/StaffPayRate' } }
    StaffPayRateResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/StaffPayRate' }
    PaySnapshotStatus:
      type: string
      enum: [LEGACY_UNAVAILABLE, CALCULATED]
    AttendanceStatus:
      type: string
      enum: [PENDING, APPROVED]
    ShiftAttendanceItem:
      type: object
      additionalProperties: false
      required: [shiftId, userId, staffName, shiftDate, shiftCode, startTime, endTime, checkInAt, checkOutAt, attendanceStatus, actualMinutes, overlapEligibleMinutes, lateMinutes, earlyLeaveMinutes, potentialOvertimeMinutes, approvedMinutes, approvedOvertimeMinutes, attendanceNote, approvedBy, approvedAt, paySnapshotStatus, regularHourlyRateSnapshot, overtimeHourlyRateSnapshot, regularPayAmount, overtimePayAmount, totalPayAmount, effectiveRegularHourlyRate, effectiveOvertimeHourlyRate, previewRegularPayAmount, previewOvertimePayAmount, previewTotalPayAmount, updatedAt]
      properties:
        shiftId: { type: integer, minimum: 1 }
        userId: { type: integer, minimum: 1 }
        staffName: { type: string }
        shiftDate: { type: string, format: date }
        shiftCode: { $ref: '#/components/schemas/ShiftCode' }
        startTime: { type: string }
        endTime: { type: string }
        checkInAt: { type: [string, 'null'] }
        checkOutAt: { type: [string, 'null'] }
        attendanceStatus: { oneOf: [{ $ref: '#/components/schemas/AttendanceStatus' }, { type: 'null' }] }
        actualMinutes: { type: integer, minimum: 0 }
        overlapEligibleMinutes: { type: integer, minimum: 0 }
        lateMinutes: { type: integer, minimum: 0 }
        earlyLeaveMinutes: { type: integer, minimum: 0 }
        potentialOvertimeMinutes: { type: integer, minimum: 0 }
        approvedMinutes: { type: [integer, 'null'], minimum: 0 }
        approvedOvertimeMinutes: { type: [integer, 'null'], minimum: 0 }
        attendanceNote: { type: [string, 'null'], maxLength: 500 }
        approvedBy: { type: [integer, 'null'], minimum: 1 }
        approvedAt: { type: [string, 'null'] }
        paySnapshotStatus: { oneOf: [{ $ref: '#/components/schemas/PaySnapshotStatus' }, { type: 'null' }] }
        regularHourlyRateSnapshot: { type: [number, 'null'] }
        overtimeHourlyRateSnapshot: { type: [number, 'null'] }
        regularPayAmount: { type: [number, 'null'] }
        overtimePayAmount: { type: [number, 'null'] }
        totalPayAmount: { type: [number, 'null'] }
        effectiveRegularHourlyRate: { type: [number, 'null'] }
        effectiveOvertimeHourlyRate: { type: [number, 'null'] }
        previewRegularPayAmount: { type: [number, 'null'] }
        previewOvertimePayAmount: { type: [number, 'null'] }
        previewTotalPayAmount: { type: [number, 'null'] }
        updatedAt: { type: string }
    ShiftAttendanceResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { type: array, items: { $ref: '#/components/schemas/ShiftAttendanceItem' } }
    AttendanceApprovalRequest:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt, approvedMinutes, approvedOvertimeMinutes]
      properties:
        expectedUpdatedAt: { type: string, minLength: 1 }
        approvedMinutes: { type: integer, minimum: 0 }
        approvedOvertimeMinutes: { type: integer, minimum: 0 }
        attendanceNote: { type: [string, 'null'], maxLength: 500 }
    ShiftAttendanceMutationResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/ShiftAttendanceItem' }
    ShiftMonitoringState:
      type: string
      enum: [SCHEDULED, CHECK_IN_WINDOW, LATE, ACTIVE_MANUAL, ACTIVE_AUTO, CHECK_OUT_WINDOW, COMPLETED_MANUAL, COMPLETED_AUTO, MISSING_STAFF, MISSING_NEXT_SHIFT, ROLLOVER_BLOCKED]
    ShiftAlertSeverity:
      type: string
      enum: [INFO, WARNING, CRITICAL]
    ShiftWeekItem:
      type: object
      additionalProperties: false
      required: [shiftId, userId, userName, staffName, role, shiftDate, shiftCode, startTime, endTime, status, checkInAt, checkOutAt, checkInSource, checkOutSource]
      properties:
        shiftId: { type: integer, minimum: 1 }
        userId: { type: integer, minimum: 1 }
        userName: { type: string }
        staffName: { type: string }
        role: { type: string, enum: [STAFF, SHIPPER] }
        shiftDate: { type: string, format: date }
        shiftCode: { $ref: '#/components/schemas/ShiftCode' }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        status: { type: string }
        checkInAt: { type: [string, 'null'] }
        checkOutAt: { type: [string, 'null'] }
        checkInSource: { $ref: '#/components/schemas/NullableShiftMutationSource' }
        checkOutSource: { $ref: '#/components/schemas/NullableShiftMutationSource' }
    ShiftWeekData:
      type: object
      additionalProperties: false
      required: [weekStart, shifts]
      properties:
        weekStart: { type: string, format: date }
        shifts: { type: array, maxItems: 21, items: { $ref: '#/components/schemas/ShiftWeekItem' } }
    ShiftWeekResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/ShiftWeekData' }
    AdminShiftWeekSlotRequest:
      type: object
      additionalProperties: false
      required: [shiftDate, shiftCode, userId, role]
      properties:
        shiftDate: { type: string, format: date }
        shiftCode: { $ref: '#/components/schemas/ShiftCode' }
        userId: { type: integer, minimum: 1 }
        role: { type: string, const: STAFF }
    AdminShiftWeekUpdateRequest:
      type: object
      additionalProperties: false
      required: [weekStart, slots]
      properties:
        weekStart: { type: string, format: date }
        slots:
          type: array
          maxItems: 21
          items: { $ref: '#/components/schemas/AdminShiftWeekSlotRequest' }
    ShiftMonitoringItem:
      type: object
      additionalProperties: false
      required: [shiftId, userId, userName, staffName, role, shiftDate, shiftCode, startTime, endTime, status, checkInAt, checkOutAt, checkInSource, checkOutSource, monitoringState, alertSeverity, activeOwnershipCount]
      properties:
        shiftId: { type: [integer, 'null'], minimum: 1 }
        userId: { type: [integer, 'null'], minimum: 1 }
        userName: { type: [string, 'null'] }
        staffName: { type: [string, 'null'] }
        role: { type: [string, 'null'], enum: [STAFF, SHIPPER, null] }
        shiftDate: { type: string, format: date }
        shiftCode: { $ref: '#/components/schemas/ShiftCode' }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        checkInAt: { type: [string, 'null'] }
        checkOutAt: { type: [string, 'null'] }
        checkInSource: { $ref: '#/components/schemas/NullableShiftMutationSource' }
        checkOutSource: { $ref: '#/components/schemas/NullableShiftMutationSource' }
        status: { type: [string, 'null'] }
        monitoringState: { $ref: '#/components/schemas/ShiftMonitoringState' }
        alertSeverity: { $ref: '#/components/schemas/ShiftAlertSeverity' }
        activeOwnershipCount: { type: integer, minimum: 0 }
    ShiftMonitoringResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { type: array, items: { $ref: '#/components/schemas/ShiftMonitoringItem' } }
    PublicStoreConfig:
      type: object
      additionalProperties: false
      required: [isOpen, openTime, closeTime, orderCutoffTime, serviceFee, taxRate, deliveryFee, minOrderAmount, estimatedDeliveryMinutes, storeName, storePhone, storeAddress, storeLogo]
      properties:
        isOpen: { type: boolean }
        openTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        closeTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        orderCutoffTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        serviceFee: { type: number, minimum: 0 }
        taxRate: { type: number, minimum: 0 }
        deliveryFee: { type: number, minimum: 0 }
        minOrderAmount: { type: number, minimum: 0 }
        estimatedDeliveryMinutes: { type: integer, minimum: 0 }
        storeName: { type: string }
        storePhone: { type: string }
        storeAddress: { type: string }
        storeLogo: { type: string }
    PublicStoreConfigResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/PublicStoreConfig' }
    OperatingExpenseCategory:
      type: string
      enum: [RENT, UTILITIES, SALARY, MARKETING, MAINTENANCE, OTHER]
    FinanceMoney:
      type: number
      format: decimal
      multipleOf: 0.01
    PositiveFinanceMoney:
      allOf:
        - $ref: '#/components/schemas/FinanceMoney'
        - exclusiveMinimum: 0
    OperatingExpense:
      type: object
      additionalProperties: false
      required: [expenseId, expenseDate, category, description, amount, createdBy, createdByName, createdAt, updatedAt]
      properties:
        expenseId: { type: integer, minimum: 1 }
        expenseDate: { type: string, format: date }
        category: { $ref: '#/components/schemas/OperatingExpenseCategory' }
        description: { type: string, minLength: 1, maxLength: 500 }
        amount: { $ref: '#/components/schemas/PositiveFinanceMoney' }
        createdBy: { type: integer, minimum: 1 }
        createdByName: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    OperatingExpenseRequest:
      type: object
      additionalProperties: false
      required: [expenseDate, category, description, amount]
      properties:
        expenseDate: { type: string, format: date }
        category: { $ref: '#/components/schemas/OperatingExpenseCategory' }
        description: { type: string, minLength: 1, maxLength: 500 }
        amount: { type: number, format: decimal, multipleOf: 0.01, exclusiveMinimum: 0 }
    OperatingExpenseResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/OperatingExpense' }
    OperatingExpenseListResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { type: array, items: { $ref: '#/components/schemas/OperatingExpense' } }
    FixedAssetStatus:
      type: string
      enum: [ACTIVE, RETIRED]
    FixedAsset:
      type: object
      additionalProperties: false
      required: [assetId, assetName, acquisitionCost, salvageValue, depreciationStartDate, usefulLifeMonths, status, retiredAt, createdBy, createdByName, createdAt, updatedAt]
      properties:
        assetId: { type: integer, minimum: 1 }
        assetName: { type: string, minLength: 1, maxLength: 255 }
        acquisitionCost: { $ref: '#/components/schemas/PositiveFinanceMoney' }
        salvageValue: { type: number, format: decimal, multipleOf: 0.01, minimum: 0 }
        depreciationStartDate: { type: string, format: date }
        usefulLifeMonths: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/FixedAssetStatus' }
        retiredAt: { type: [string, 'null'] }
        createdBy: { type: integer, minimum: 1 }
        createdByName: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    FixedAssetRequest:
      type: object
      additionalProperties: false
      required: [assetName, acquisitionCost, salvageValue, depreciationStartDate, usefulLifeMonths]
      properties:
        assetName: { type: string, minLength: 1, maxLength: 255 }
        acquisitionCost: { type: number, format: decimal, multipleOf: 0.01, exclusiveMinimum: 0 }
        salvageValue: { type: number, format: decimal, multipleOf: 0.01, minimum: 0 }
        depreciationStartDate: { type: string, format: date }
        usefulLifeMonths: { type: integer, minimum: 1 }
    FixedAssetRetireRequest:
      type: object
      additionalProperties: false
      required: [expectedStatus]
      properties:
        expectedStatus: { type: string, const: ACTIVE }
    FixedAssetResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/FixedAsset' }
    FixedAssetListResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { type: array, items: { $ref: '#/components/schemas/FixedAsset' } }
    OperatingProfitData:
      type: object
      additionalProperties: false
      required: [grossRevenue, refundTotal, netRevenue, cogs, grossProfit, operatingExpenses, storeExpenses, profitBeforeDepreciation, estimatedOperatingResult, depreciation, operatingProfit, includesManualSalary, costComplete, missingCostItemCount, fromDate, toDate]
      properties:
        grossRevenue: { $ref: '#/components/schemas/FinanceMoney' }
        refundTotal: { $ref: '#/components/schemas/FinanceMoney' }
        netRevenue: { $ref: '#/components/schemas/FinanceMoney' }
        cogs: { oneOf: [{ $ref: '#/components/schemas/FinanceMoney' }, { type: 'null' }] }
        grossProfit: { oneOf: [{ $ref: '#/components/schemas/FinanceMoney' }, { type: 'null' }] }
        operatingExpenses: { $ref: '#/components/schemas/FinanceMoney' }
        storeExpenses: { $ref: '#/components/schemas/FinanceMoney' }
        profitBeforeDepreciation: { oneOf: [{ $ref: '#/components/schemas/FinanceMoney' }, { type: 'null' }] }
        estimatedOperatingResult: { oneOf: [{ $ref: '#/components/schemas/FinanceMoney' }, { type: 'null' }] }
        depreciation: { $ref: '#/components/schemas/FinanceMoney' }
        operatingProfit: { oneOf: [{ $ref: '#/components/schemas/FinanceMoney' }, { type: 'null' }] }
        includesManualSalary: { type: boolean, const: true }
        costComplete: { type: boolean }
        missingCostItemCount: { type: integer, minimum: 0 }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
    OperatingProfitResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: { type: string, const: success }
        data: { $ref: '#/components/schemas/OperatingProfitData' }
    InventoryMode:
      type: string
      enum: [INGREDIENT, FINISHED_GOOD, UNTRACKED, SUSPENDED]
    BaseUnit:
      type: string
      enum: [G, ML, PIECE]
    InventoryCountFrequency:
      type: string
      enum: [DAILY, WEEKLY]
    Money:
      type: number
      format: decimal
      minimum: 0
      maximum: 999999999999999.9999
      multipleOf: 0.0001
    InventoryItemQuantity:
      type: number
      format: decimal
      minimum: 0
      maximum: 999999999999999.9999
      multipleOf: 0.0001
    InventoryItem:
      type: object
      additionalProperties: false
      required: [inventoryItemId, inventoryCode, name, itemType, baseUnit, onHandQuantity, reservedQuantity, availableQuantity, minimumQuantity, countFrequency, averageUnitCost, active, createdAt, updatedAt]
      properties:
        inventoryItemId: { type: integer, minimum: 1 }
        inventoryCode: { type: string, minLength: 1, maxLength: 30 }
        name: { type: string, minLength: 1, maxLength: 150 }
